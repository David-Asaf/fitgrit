name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint code
        run: yarn lint

      - name: Run tests
        run: yarn test

      - name: Build mobile (EAS dry run)
        run: |
          npx eas build:configure --non-interactive || echo "EAS build configuration skipped"
          echo "EAS build step is a dry run for CI."

      - name: Build web
        run: |
          npx expo export --platform web || echo "Web build failed or not configured"

    # Add caching for node_modules
    # Add comments for clarity
